[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scanthedoc"
version = "1.0.0"
description = "Private document processing and searchable archive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "arq>=0.26,<1",
    "asyncpg>=0.30,<1",
    "boto3>=1.35,<2",
    "clerk-backend-api>=6,<7",
    "fastapi>=0.115,<1",
    "ftfy>=6.3,<7",
    "pillow>=11,<13",
    "pymupdf>=1.25,<2",
    "pydantic-settings>=2.7,<3",
    "pypdf>=5,<7",
    "pypdfium2>=4.30,<5",
    "pytesseract>=0.3.13,<1",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "svix>=1.45,<2",
    "truststore>=0.10.4,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]


